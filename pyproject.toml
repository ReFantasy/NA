[project]
name = "NumericalMethods"
version = "0.1.0"
description = "A collection of numerical methods for analysis and optimization."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "jax>=0.9.2",
    "jax[cuda12]>=0.9.2 ; sys_platform == 'linux'",
    "loguru>=0.7.3",
]

[tool.setuptools]
packages = ["NumericalAnalysis", "NumericalOptimization"]
